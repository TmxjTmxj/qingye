<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>轻页 · 示例页面</title>
<body>
  <header><b>轻页</b><span>轻量 · 本地 · 即开即用</span></header>
  <main>
    <p class="eyebrow">A LITTLE ROOM TO CREATE</p>
    <h1>让阅读，<br>轻一点。</h1>
    <p class="intro">打开一份文件，留一点专注。<br>查看、修改，在同一个清爽的空间。</p>
    <button onclick="this.textContent='今天的编辑已就绪'">开始今天的编辑 →</button>
    <section>
      <article><small>01 / READ</small><h3>安心阅读</h3><p>从文字到代码，<br>给每一种内容合适的视角。</p></article>
      <article><small>02 / CREATE</small><h3>随手修改</h3><p>改一行，存一份。<br>简单的事，保持简单。</p></article>
    </section>
    <footer>这是可编辑的示例文件 · 修改源码会更新预览</footer>
  </main>
</body>
</html>
